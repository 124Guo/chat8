
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Chat8 - 即时聊天</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6fb;color:#202438;font-family:Arial,sans-serif}
button,input{font:inherit}
.app{max-width:1100px;height:100vh;min-height:550px;margin:auto;background:white;display:flex;box-shadow:0 5px 30px #0001}
.sidebar{width:280px;border-right:1px solid #eee;display:flex;flex-direction:column}
.logo{padding:24px;font-size:25px;font-weight:bold;color:#6558df}
.profile{margin:0 15px 18px;padding:14px;background:#f6f5ff;border-radius:14px;display:flex;align-items:center;gap:12px}
.avatar{width:43px;height:43px;border-radius:50%;background:#dedaff;color:#6558df;display:flex;align-items:center;justify-content:center;font-weight:bold;overflow:hidden;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.profile-info{flex:1;min-width:0}
.profile-info strong{display:block;overflow-wrap:anywhere}
.small{font-size:12px;color:#999;margin-top:5px}
button{cursor:pointer}
.lightbtn{border:0;background:none;color:#6558df}
.search{margin:0 15px 18px;padding:12px;border:1px solid #eee;border-radius:10px}
.section{padding:5px 20px 12px;color:#999;font-size:12px}
.friend{padding:13px 18px;display:flex;align-items:center;gap:12px;cursor:pointer}
.friend:hover{background:#f5f4ff}
.friend p{margin:5px 0 0;font-size:12px;color:#999}
.online{width:8px;height:8px;background:#32c58b;border-radius:50%;margin-left:auto}
.sidebar-bottom{margin-top:auto;padding:18px;border-top:1px solid #eee;display:flex;justify-content:space-between}
.chat{flex:1;min-width:0;display:flex;flex-direction:column}
.header{height:75px;border-bottom:1px solid #eee;display:flex;align-items:center;padding:0 22px;gap:12px}
.header-info{flex:1}
.header-info p{margin:5px 0 0;color:#999;font-size:12px}
.messages{flex:1;padding:25px;overflow-y:auto}
.welcome{text-align:center;margin:18vh auto;color:#999}
.bubble{max-width:75%;width:max-content;background:#f0f1f6;padding:12px 15px;border-radius:15px;margin:10px 0;overflow-wrap:anywhere;line-height:1.5}
.mine{margin-left:auto;background:#6558df;color:white}
.time{font-size:10px;opacity:.65;margin-top:5px}
.composer{padding:16px;border-top:1px solid #eee;display:flex;gap:10px}
.composer input{flex:1;min-width:0;border:1px solid #eee;border-radius:12px;padding:13px;outline:none}
.send,.primary{background:#6558df;color:white;border:0;border-radius:11px;padding:12px 20px;font-weight:bold}
.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:18px}
.modal.show{display:flex}
.panel{background:white;width:100%;max-width:400px;padding:25px;border-radius:18px}
.panel h2{margin-top:0}
.panel label{display:block;margin:15px 0 7px;font-size:14px}
.panel input{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px}
.panel .primary{width:100%;margin-top:20px}
.note{font-size:12px;color:#999;line-height:1.5}
@media(max-width:650px){
 .app{height:100dvh}
 .sidebar{width:115px}
 .logo{padding:17px 10px;font-size:20px}
 .profile{margin:0 7px 12px;padding:9px;display:block;text-align:center}
 .profile .avatar{margin:auto}
 .profile-info{font-size:11px;margin-top:7px}
 .profile-info .small{font-size:10px}
 .search{margin:0 7px 12px;padding:8px;font-size:11px}
 .section{padding:5px;font-size:10px}
 .friend{padding:12px 7px;display:block;text-align:center}
 .friend .avatar{margin:auto}
 .friend p{font-size:10px}
 .online{display:none}
 .sidebar-bottom{padding:8px;display:block;text-align:center}
 .sidebar-bottom button{display:block;margin:10px auto;font-size:11px}
 .header{padding:0 12px;height:65px}
 .messages{padding:13px}
 .composer{padding:10px}
 .send{padding:10px}
}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
 <div class="logo">✦ Chat8</div>
 <div class="profile">
  <div class="avatar" id="myAvatar">?</div>
  <div class="profile-info">
   <strong id="myName">设置个人资料</strong>
   <div class="small" id="myId">创建你的 ID</div>
  </div>
  <button class="lightbtn" onclick="openProfile()">✎</button>
 </div>
 <div class="search" id="searchText">⌕ 搜索聊天</div>
 <div class="section" id="recentText">最近聊天</div>
 <div class="friend">
  <div class="avatar">C</div>
  <div><strong>Chat8 助手</strong><p id="welcomeText">欢迎使用 Chat8</p></div>
  <span class="online"></span>
 </div>
 <div class="sidebar-bottom">
  <button class="lightbtn" onclick="changeLanguage()" id="langBtn">🌐 中文 / EN</button>
  <button class="lightbtn" onclick="openProfile()" id="settingsText">⚙ 设置</button>
 </div>
</aside>

<main class="chat">
 <header class="header">
  <div class="avatar">C</div>
  <div class="header-info">
   <strong>Chat8 助手</strong>
   <p>🟢 <span id="onlineText">在线</span></p>
  </div>
 </header>
 <section class="messages" id="messages">
  <div class="welcome" id="welcome">
   <div style="font-size:35px">✦</div>
   <h3 id="helloText">欢迎来到 Chat8</h3>
   <p id="startText">发送一条消息，开始体验聊天。</p>
  </div>
 </section>
 <form class="composer" id="composer">
  <input id="messageInput" placeholder="输入消息..." autocomplete="off">
  <button class="send" id="sendText">发送</button>
 </form>
</main>
</div>

<div class="modal" id="profileModal">
 <form class="panel" id="profileForm">
  <h2 id="profileTitle">创建你的 Chat8 资料</h2>
  <p class="note" id="profileDesc">设置昵称和唯一 ID，也可以从相册选择头像。</p>
  <label id="nicknameLabel">昵称</label>
  <input id="nickname" maxlength="24" required placeholder="你的昵称">
  <label>Chat8 ID</label>
  <input id="userId" minlength="3" maxlength="20"
   pattern="[A-Za-z0-9_]+" required placeholder="例如 alex_88">
  <label id="photoLabel">选择头像</label>
  <input id="photo" type="file" accept="image/*">
  <button class="primary" id="saveText">保存资料</button>
  <p class="note" id="localNote">当前版本只在本设备保存资料和消息。</p>
 </form>
</div>

<script>
let language="zh";
let profile=JSON.parse(localStorage.getItem("chat8-profile")||"null");
let history=JSON.parse(localStorage.getItem("chat8-messages")||"[]");

const translations={
 zh:{
  search:"⌕ 搜索聊天",recent:"最近聊天",welcome:"欢迎使用 Chat8",
  online:"在线",hello:"欢迎来到 Chat8",start:"发送一条消息，开始体验聊天。",
  placeholder:"输入消息...",send:"发送",settings:"⚙ 设置",
  title:"创建你的 Chat8 资料",desc:"设置昵称和唯一 ID，也可以从相册选择头像。",
  nickname:"昵称",photo:"选择头像",save:"保存资料",
  local:"当前版本只在本设备保存资料和消息。"
 },
 en:{
  search:"⌕ Search chats",recent:"RECENT CHATS",welcome:"Welcome to Chat8",
  online:"Online",hello:"Welcome to Chat8",start:"Send a message to try chatting.",
  placeholder:"Type a message...",send:"Send",settings:"⚙ Settings",
  title:"Create your Chat8 profile",desc:"Choose a name, unique ID and avatar.",
  nickname:"Name",photo:"Choose avatar",save:"Save profile",
  local:"This version saves profile and messages on this device only."
 }
};

function changeLanguage(){
 language=language==="zh"?"en":"zh";
 const t=translations[language];
 document.getElementById("searchText").textContent=t.search;
 document.getElementById("recentText").textContent=t.recent;
 document.getElementById("welcomeText").textContent=t.welcome;
 document.getElementById("onlineText").textContent=t.online;
 document.getElementById("helloText").textContent=t.hello;
 document.getElementById("startText").textContent=t.start;
 document.getElementById("messageInput").placeholder=t.placeholder;
 document.getElementById("sendText").textContent=t.send;
 document.getElementById("settingsText").textContent=t.settings;
 document.getElementById("profileTitle").textContent=t.title;
 document.getElementById("profileDesc").textContent=t.desc;
 document.getElementById("nicknameLabel").textContent=t.nickname;
 document.getElementById("photoLabel").textContent=t.photo;
 document.getElementById("saveText").textContent=t.save;
 document.getElementById("localNote").textContent=t.local;
 document.documentElement.lang=language==="zh"?"zh-CN":"en";
}

function openProfile(){
 document.getElementById("profileModal").classList.add("show");
 if(profile){
  document.getElementById("nickname").value=profile.name;
  document.getElementById("userId").value=profile.id;
 }
}

function showProfile(){
 if(!profile)return;
 document.getElementById("myName").textContent=profile.name;
 document.getElementById("myId").textContent="@"+profile.id;
 const avatar=document.getElementById("myAvatar");
 if(profile.avatar)avatar.innerHTML='<img src="'+profile.avatar+'" alt="头像">';
 else avatar.textContent=profile.name.charAt(0).toUpperCase();
}

document.getElementById("profileForm").onsubmit=function(e){
 e.preventDefault();
 const name=document.getElementById("nickname").value.trim();
 const id=document.getElementById("userId").value.trim();
 if(!name||!/^[A-Za-z0-9_]{3,20}$/.test(id)){
  alert("ID 请使用 3-20 位英文字母、数字或下划线");
  return;
 }
 const file=document.getElementById("photo").files[0];
 function save(avatar){
  profile={name,id,avatar:avatar||profile?.avatar||""};
  localStorage.setItem("chat8-profile",JSON.stringify(profile));
  showProfile();
  document.getElementById("profileModal").classList.remove("show");
 }
 if(file){
  const reader=new FileReader();
  reader.onload=()=>save(reader.result);
  reader.readAsDataURL(file);
 }else save("");
};

function addMessage(text,mine){
 const welcome=document.getElementById("welcome");
 if(welcome)welcome.remove();
 const bubble=document.createElement("div");
 bubble.className="bubble"+(mine?" mine":"");
 bubble.appendChild(document.createTextNode(text));
 const time=document.createElement("div");
 time.className="time";
 time.textContent=new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
 bubble.appendChild(time);
 const messages=document.getElementById("messages");
 messages.appendChild(bubble);
 messages.scrollTop=messages.scrollHeight;
}

history.forEach(item=>addMessage(item.text,item.mine));

document.getElementById("composer").onsubmit=function(e){
 e.preventDefault();
 const input=document.getElementById("messageInput");
 const text=input.value.trim();
 if(!text)return;
 addMessage(text,true);
 history.push({text,mine:true});
 localStorage.setItem("chat8-messages",JSON.stringify(history));
 input.value="";
};

showProfile();
if(!profile)openProfile();
</script>
</body>
</html>
